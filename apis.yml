aid: terraframe-inc

name: TerraFrame, Inc.

description: 'TerraFrame provides open‑source software and standards that let organizations create location‑aware, LLM‑based GeoAI solutions by accessing up‑to‑date, integrated geospatial data. It enables the publication of Spatial Knowledge Graphs and uses its Geo‑GraphRAG translator to connect maps with AI for applications in public health, disaster response, defense, and economic forecasting.'

